name: CI – Flutter Analyze, Test & Node.js Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  flutter-verify:
    name: 📱 Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis (Rubric Criterion 7)
        run: flutter analyze

      - name: Run unit & widget tests (Rubric Criterion 5)
        run: flutter test

  server-verify:
    name: 🟩 Node.js Syntax & Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax
        run: |
          node --check src/server.js
          node --check src/app.js
          node --check src/controllers/explain.controller.js
          node --check src/services/gemini.service.js

